services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./data/realieprep.db
      EXPECTED_QUESTION_COUNT: ${EXPECTED_QUESTION_COUNT:-300}
      EXPECTED_CATEGORY_COUNT: ${EXPECTED_CATEGORY_COUNT:-30}
      EXPECTED_QUESTIONS_PER_CATEGORY: ${EXPECTED_QUESTIONS_PER_CATEGORY:-10}
      PASSING_GRADE_PERCENT: ${PASSING_GRADE_PERCENT:-60}
      WEAK_TOPIC_MIN_ATTEMPTS: ${WEAK_TOPIC_MIN_ATTEMPTS:-5}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: ./data/uploads
      OFFICIAL_BANK_URL: ${OFFICIAL_BANK_URL:-https://cestina-pro-cizince.cz/obcanstvi/databanka-uloh/}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:80"
