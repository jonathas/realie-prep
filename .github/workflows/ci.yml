name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify migrations from an empty database
        run: |
          mkdir -p data
          alembic upgrade head
          alembic check

      - name: Run backend tests
        run: pytest

      - name: Lint Python
        run: ruff check .

      - name: Type-check Python
        run: mypy app

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start clean stack
        run: docker compose up --detach --no-build

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify clean first-run state
        run: >-
          python3 -c "import json, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/admin/status'));
          assert data['question_count'] == 0, data"

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
